<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简谱编辑 · WindScore</title>
    <link rel="icon" href="/favicon.svg" />
    <script>
      // 主题先于首帧定下（防深色用户闪白底）：ws-theme 与首页等各页面共用
      (function () {
        try {
          var t = localStorage.getItem('ws-theme');
          if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.dataset.theme = 'dark';
            // 组件挂载前先把画布压暗，避免深色用户看到一帧白底
            document.documentElement.style.background = '#18181b';
          }
        } catch (e) { /* 隐私模式读不了 localStorage，落浅色 */ }
      })();
    </script>
  </head>
  <body data-entry="editor">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
