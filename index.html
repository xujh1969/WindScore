<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WindScore · 电吹管动态谱</title>
    <meta name="description" content="WindScore：简谱写谱器、对轨（伴奏对齐）与曲库，一体化动态谱制作工具" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/home.css" />
    <script>
      // 主题先于首帧定下（防止深色用户闪一帧白底）：ws-theme 与编辑器等各页面共用；
      // 没记录过就跟随系统偏好
      (function () {
        try {
          var t = localStorage.getItem('ws-theme');
          if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.dataset.theme = 'dark';
          }
        } catch (e) { /* 隐私模式读不了 localStorage，落浅色 */ }
      })();
    </script>
  </head>
  <body class="ws-home">
    <div class="ws-home-bg" aria-hidden="true"></div>
    <nav class="ws-home-menu" aria-label="顶部菜单">
      <button id="wsThemeBtn" class="ws-theme-btn" type="button" aria-label="切换深浅主题" title="切换深浅主题">
        <!-- 浅色显示月亮（点去深色）；深色显示太阳（点回浅色）——全站统一约定 -->
        <svg class="ws-theme-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15.5 12.2A6.5 6.5 0 0 1 7.8 4.5a6.5 6.5 0 1 0 7.7 7.7z" />
        </svg>
        <svg class="ws-theme-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="10" cy="10" r="3.4" fill="currentColor" stroke="none" />
          <path d="M10 2.4v1.9M10 15.7v1.9M2.4 10h1.9M15.7 10h1.9M4.7 4.7l1.3 1.3M14 14l1.3 1.3M15.3 4.7L14 6M6 14l-1.3 1.3" />
        </svg>
      </button>
      <a class="ws-btn ws-btn-ghost" href="./help.html">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="10" cy="10" r="8" />
          <path d="M7.5 7.3a2.5 2.5 0 0 1 5 .2c0 1.6-2.5 1.8-2.5 3.4M10 14h.01" />
        </svg>
        帮助
      </a>
    </nav>

    <main class="ws-home-main">
      <!-- LOGO：金色记谱标记 + WindScore 字标（矢量，随页面缩放） -->
      <div class="ws-logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" role="img">
          <rect x="2" y="2" width="60" height="60" rx="14" fill="rgba(217,178,60,0.14)" stroke="#d9b23c" stroke-width="1.5" />
          <g stroke="#d9b23c" stroke-width="2" stroke-linecap="round" opacity="0.55">
            <path d="M14 24h36" />
            <path d="M14 32h36" />
            <path d="M14 40h24" />
          </g>
          <path d="M26 42V22l16-3.5V38" stroke="#f4e3b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <ellipse cx="22.5" cy="42.5" rx="4.6" ry="3.6" transform="rotate(-18 22.5 42.5)" fill="#f4e3b2" />
          <ellipse cx="38.5" cy="38.5" rx="4.6" ry="3.6" transform="rotate(-18 38.5 38.5)" fill="#f4e3b2" />
        </svg>
      </div>

      <header class="ws-home-head">
        <h1 class="ws-home-title">
          <span class="ws-home-title-en">WindScore</span>
          动态谱制作工具
        </h1>
        <p class="ws-home-sub">给电吹管的简谱写谱、伴奏对轨与曲库管理，一首歌从纸面到动态谱。</p>
      </header>

      <nav class="ws-home-actions" aria-label="入口">
        <a class="ws-btn ws-btn-primary" href="./play.html">
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M6 4.5v11l9-5.5z" />
          </svg>
          动态谱演奏
        </a>
        <a class="ws-btn ws-btn-ghost" href="./editor.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.8 3.9l3.3 3.3L7 16.3l-4 1 1-4z" />
          </svg>
          简谱编辑
        </a>
        <a class="ws-btn ws-btn-ghost" href="./align.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M3 8v4M6.5 5v10M10 2v16M13.5 6v8M17 8v4" />
          </svg>
          动态谱生成
        </a>
        <!-- 曲库管理是独立页面（library.html）：不进记谱，直接管一批谱 -->
        <a class="ws-btn ws-btn-ghost" href="./library.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 4h4v12H3zM8.5 4h4v12h-4zM14 3.6h3.1l-1 12.8H14z" />
          </svg>
          曲库管理
        </a>
        <!-- 两个测试功能收进「更多」：启动页默认只露四个主入口 -->
        <details class="ws-home-more">
          <summary>更多</summary>
          <div class="ws-home-more-list">
            <!-- 乐谱导入（MusicXML 转译，musicxml.html）：测试功能，虚线边框以示区别 -->
            <a class="ws-btn ws-btn-ghost ws-btn-test" href="./musicxml.html" title="测试功能：从 MusicXML（.musicxml / .xml / .mxl）导入并转译为 .jps">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 2H5.5A1.5 1.5 0 0 0 4 3.5v13A1.5 1.5 0 0 0 5.5 18h9a1.5 1.5 0 0 0 1.5-1.5V7z" />
                <path d="M11 2v5h5M7.5 12.5l1.5 1.5 3-3.5" />
              </svg>
              乐谱导入
            </a>
            <!-- 按简谱识别（ScoreOCR 集成，ocr.html）：测试功能，虚线边框以示区别 -->
            <a class="ws-btn ws-btn-ghost ws-btn-test" href="./ocr.html" title="测试功能：识别简谱图片 / PDF，转为可编辑的 .jps（首次识别需下载约 25MB 识别模型）">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="14" height="14" rx="2" />
                <circle cx="8" cy="12.5" r="1.4" fill="currentColor" stroke="none" />
                <path d="M9.4 12.5V6.8l4.2-1v5.2" />
                <circle cx="12.2" cy="11" r="1.4" fill="currentColor" stroke="none" />
              </svg>
              按简谱识别
            </a>
          </div>
        </details>
      </nav>

      <footer class="ws-home-foot">
        <p class="ws-home-author">软件作者：程序员老许，VX：da-han</p>
        <!-- 版本号由 package.json 注入（vite.config.ts 的 versionInject），别手改 -->
        <p class="ws-home-version">版本 %APP_VERSION%</p>
      </footer>
    </main>
  </body>
  <!--
    安卓 App（WebView 壳，域名 appassets.androidplatform.net）里不提供编辑、对轨与 OCR
    （OCR 模型约 26MB 且计算重，安卓包不含 ocr 页），把这些入口藏掉；桌面 / 浏览器域名不受影响。
  -->
  <script>
    if (location.hostname === 'appassets.androidplatform.net') {
      document.querySelectorAll('a[href="./editor.html"], a[href="./align.html"], a[href="./ocr.html"]')
        .forEach((a) => (a.style.display = 'none'));
    }
  </script>
  <script>
    // 首页主题开关：切 html[data-theme]（home.css 据此换底图与配色），并记住选择（ws-theme）
    document.getElementById('wsThemeBtn').addEventListener('click', function () {
      var dark = document.documentElement.dataset.theme === 'dark';
      var next = dark ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try {
        localStorage.setItem('ws-theme', next);
      } catch (e) { /* 隐私模式写不进就算了，本次会话内仍有效 */ }
    });
  </script>
</html>
