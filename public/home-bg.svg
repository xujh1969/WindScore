<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!--
    首页背景：深蓝紫夜幕 + 五线谱剪影 + 柔光。
    刻意做成矢量：大屏不糊、离线可用、体积只有几 KB。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c22" />
      <stop offset="0.45" stop-color="#161a44" />
      <stop offset="1" stop-color="#2b1743" />
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b7cff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#5b7cff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9b23c" stop-opacity="0.42" />
      <stop offset="1" stop-color="#d9b23c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a05bff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#a05bff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="staffStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="noteFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e3b2" />
      <stop offset="1" stop-color="#d9b23c" />
    </linearGradient>
    <!-- 一个音符：符头 + 符干 + 符尾 -->
    <g id="note">
      <ellipse cx="0" cy="0" rx="9.5" ry="6.8" transform="rotate(-20)" fill="url(#noteFill)" />
      <rect x="7.4" y="-46" width="2.6" height="46" fill="url(#noteFill)" />
      <path d="M10 -46 q13 6 12 20 q-4 -12 -12 -12 z" fill="url(#noteFill)" />
    </g>
    <!-- 一个休止符（简谱的 0：椭圆 + 下垂笔画） -->
    <g id="rest">
      <ellipse cx="0" cy="0" rx="9" ry="6.4" transform="rotate(-20)" fill="url(#noteFill)" />
      <path d="M4 4 q10 10 2 22" stroke="url(#noteFill)" stroke-width="2.6" fill="none" />
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- 柔光：左上蓝、右侧金、下方紫，制造纵深 -->
  <ellipse cx="250" cy="140" rx="520" ry="420" fill="url(#glowA)" />
  <ellipse cx="1400" cy="700" rx="600" ry="460" fill="url(#glowB)" />
  <ellipse cx="1180" cy="120" rx="520" ry="400" fill="url(#glowC)" />
  <ellipse cx="640" cy="880" rx="700" ry="380" fill="url(#glowA)" opacity="0.5" />

  <!-- 五线谱剪影：四条谱带，各自微微倾斜，越远越淡（空气感） -->
  <g opacity="0.5" transform="rotate(-3 800 450)">
    <g stroke="url(#staffStroke)" stroke-width="1.4">
      <path d="M-40 250 H1640" /><path d="M-40 268 H1640" /><path d="M-40 286 H1640" />
      <path d="M-40 304 H1640" /><path d="M-40 322 H1640" />
    </g>
    <g opacity="0.85">
      <use href="#note" x="180" y="268" />
      <use href="#note" x="330" y="286" />
      <use href="#note" x="470" y="250" />
      <use href="#rest" x="620" y="304" />
      <use href="#note" x="770" y="286" />
      <use href="#note" x="930" y="268" />
      <use href="#note" x="1080" y="304" />
      <use href="#rest" x="1240" y="250" />
      <use href="#note" x="1390" y="286" />
    </g>
  </g>

  <g opacity="0.36" transform="rotate(2.5 800 450)">
    <g stroke="url(#staffStroke)" stroke-width="1.3">
      <path d="M-40 500 H1640" /><path d="M-40 516 H1640" /><path d="M-40 532 H1640" />
      <path d="M-40 548 H1640" /><path d="M-40 564 H1640" />
    </g>
    <g opacity="0.8">
      <use href="#note" x="120" y="532" />
      <use href="#note" x="290" y="516" />
      <use href="#rest" x="440" y="548" />
      <use href="#note" x="600" y="532" />
      <use href="#note" x="760" y="500" />
      <use href="#note" x="910" y="548" />
      <use href="#rest" x="1070" y="516" />
      <use href="#note" x="1230" y="532" />
      <use href="#note" x="1400" y="516" />
      <use href="#note" x="1540" y="548" />
    </g>
  </g>

  <g opacity="0.22" transform="rotate(-1.5 800 450)">
    <g stroke="url(#staffStroke)" stroke-width="1.2">
      <path d="M-40 730 H1640" /><path d="M-40 744 H1640" /><path d="M-40 758 H1640" />
      <path d="M-40 772 H1640" /><path d="M-40 786 H1640" />
    </g>
    <g opacity="0.7">
      <use href="#note" x="240" y="744" />
      <use href="#rest" x="420" y="772" />
      <use href="#note" x="600" y="758" />
      <use href="#note" x="820" y="730" />
      <use href="#note" x="1010" y="772" />
      <use href="#note" x="1200" y="744" />
      <use href="#rest" x="1380" y="758" />
    </g>
  </g>

  <!-- 底部压暗：让标题与按钮始终有足够对比 -->
  <rect y="560" width="1600" height="340" fill="#05060f" opacity="0.35" />
</svg>
